# Builds the APK on every push to main and publishes it as the "latest" release,
# so the newest build can be downloaded straight from the phone.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk civic-obd.apk

      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest civic-obd.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Download civic-obd.apk on the phone and install it."
