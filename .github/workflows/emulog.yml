name: Emulator log

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the test APK
        run: gradle assembleUitest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: emulog-apk
          path: app/build/outputs/apk/uitest/app-uitest.apk

  run:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        gpu: [swiftshader_indirect, guest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: emulog-apk
          path: app/build/outputs/apk/uitest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Start an emulator by hand, logging to a file
        timeout-minutes: 22
        run: |
          SDK=$ANDROID_HOME
          export PATH=$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$SDK/emulator:$PATH
          export ANDROID_AVD_HOME=$HOME/.android/avd
          mkdir -p "$ANDROID_AVD_HOME" bisect
          IMG="system-images;android-33;google_apis;x86_64"
          (yes | sdkmanager --licenses; yes | sdkmanager --install "$IMG" "emulator" "platform-tools") > bisect/setup.log 2>&1 || true
          echo no | avdmanager --verbose create avd --force --name t --device pixel_6 --package "$IMG" --tag google_apis --abi x86_64 >> bisect/setup.log 2>&1 || true
          ls -la "$ANDROID_AVD_HOME" >> bisect/setup.log 2>&1
          emulator -list-avds >> bisect/setup.log 2>&1
          emulator -avd t -no-window -gpu ${{ matrix.gpu }} -no-snapshot -noaudio -no-boot-anim -memory 4096 -verbose > emulator.log 2>&1 &
          EMU=$!
          timeout 600 adb wait-for-device
          for i in $(seq 1 200); do [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ] && break; sleep 3; done
          sleep 20
          bash .github/bisect.sh burst || true
          sleep 5
          echo "emulator process: $(ps -p $EMU -o pid=,stat= || echo exited)" | tee -a bisect/result.txt
          kill $EMU 2>/dev/null || true
      - name: Publish
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bisect
          cp emulator.log bisect/emulator.log || true
          cp emulator_version.txt bisect/ || true
          tail -c 200000 bisect/emulator.log > bisect/emulator_tail.log || true
          gh release delete emulog-${{ matrix.gpu }} --yes --cleanup-tag || true
          gh release create emulog-${{ matrix.gpu }} $(find bisect -maxdepth 1 -type f -size +0 | sort | awk 'NR<=8 || /final|result|logcat|emulator/') \
            --prerelease --title "Emulator log ${{ matrix.gpu }}" --notes "Run ${{ github.run_number }}"
