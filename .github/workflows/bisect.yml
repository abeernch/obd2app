name: Bisect emulator crash

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build the test APK
        run: gradle assembleUitest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: bisect-apk
          path: app/build/outputs/apk/uitest/app-uitest.apk

  run:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [base, no_intro, rect_clip, no_page, classic_font, no_cluster]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bisect-apk
          path: app/build/outputs/apk/uitest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on emulator
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          heap-size: 576M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: false
          emulator-boot-timeout: 900
          script: bash .github/bisect.sh ${{ matrix.variant }}
      - name: Publish frames
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bisect
          ls -la bisect
          gh release delete bisect-${{ matrix.variant }} --yes --cleanup-tag || true
          gh release create bisect-${{ matrix.variant }} $(find bisect -maxdepth 1 -type f -size +0 | sort | awk 'NR<=12 || /final|result|logcat/') \
            --prerelease --title "Bisect ${{ matrix.variant }}" --notes "Run ${{ github.run_number }}"
